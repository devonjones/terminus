name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Format check (black)
        run: uv run black --check src tests
      - name: Unit tests
        run: uv run pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
      - name: Install sidecar (the e2e runs the real one from .venv)
        run: uv sync --dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: API types match the sidecar schema
        run: npm run gen:api && git diff --exit-code src/api/generated.ts
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
      - name: Format check (prettier)
        run: npm run format:check
      - name: Unit tests (vitest)
        run: npm test
      # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces Chromium's
      # sandbox needs; allow them rather than run Electron with --no-sandbox.
      - name: End to end (Playwright + Electron)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run e2e
