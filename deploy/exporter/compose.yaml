# Portainer stack for `terminus exporter` on hades. Pin the image to a full commit SHA.
services:
  seestar-exporter:
    image: ghcr.io/devonjones/terminus:<full-commit-sha>
    restart: unless-stopped
    environment:
      SEESTAR_HOST: <scope-ip>
      POLL_S: "30"
      ON_DESK_DEG: "10"
      # The scope allows few control connections and the phone app needs one: connect
      # for NATIVE_HOLD_S out of every NATIVE_EVERY_S, never hold it all night.
      NATIVE_HOLD_S: "10"
      NATIVE_EVERY_S: "60"
      # Alpaca devices the exporter may set Connected=true on (never the camera).
      ALPACA_CONNECT: "focuser,switch"
    ports:
      - "9877:9877"
